name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Öffentlichen Stand prüfen
        run: python vagabund-1848/pruefe.py
